<!doctype html><html lang="en"><meta charset="utf-8"><title>architecture-cleaner</title><link rel="stylesheet" href="card.css">

<style>
html,body{width:1280px;height:720px;overflow:hidden}
body{display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 32px;box-sizing:border-box}
.pitch{font-size:34px;line-height:1.2;margin:0;width:520px}
.pitch span{margin-bottom:46px}
.left{width:520px}
.cmd{margin:64px 0 0}
.cmd code{font-size:30px;padding:6px 14px}
#diagram .legend{display:none}
</style>
<div class="left">

</div>
<div id="diagram"></div>

<script>renderRestructure(document.getElementById('diagram'), { mono: '22px', title: '26px', note: '16px', gap: '8px', pad: '10px 18px 8px', arrow: '87px', dot: '10px' }, { arrow: 'triangle' });</script>
</html>
