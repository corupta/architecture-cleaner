<!doctype html><html lang="en"><meta charset="utf-8"><title>A seeded fault: attempt 1 fails, attempt 2 is certified</title>
<!-- M4, shot "fault" (B6's end): the seeded run's step from its own log (data.runs.fault): the attempt the checker
     failed, the rollback, the file pinned where it was, and the attempt that was certified. The title is static. The
     four blocks are a chronology: each, with the note under it and the arrow into it, is faint with an ink outline
     until its moment, then opaque (the loop's convention, loop.html). Outlines: attempt 1 red (failure), attempt 2
     green (success), the two between ink. Nothing moves. -->
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="diagrams.css">
<script src="../../out/v2/data.js"></script>
<script src="common.js"></script>
<div class="stage" id="stage"><svg class="wires" id="wires"></svg></div>
<script>
// Seconds on the page's clock, keyed to the voice-over (v2.3, B6): "ac rolled the commit back and redid the step
// without that file. Certified."
const SCHEDULE = {
  stages: [0, 0.3, 1.9, 3.5], // attempt 1 ✗, rolled back, the pinned file, attempt 2 ✓: each just before corupta says it
  // ("ac rolled back the commit" 0.3 s, "excluded the file" 2.0 s, "succeeded in the next attempt" 3.6 s into the shot)
  lighting: 0.5, // faint → opaque, and each outline change
};
// Not yet its moment: faint, as in the loop (loop.html).
const FAINT = 0.25;

const run = data.runs.fault;
const rollback = run.rollbacks[0];
const failed = run.certifies.find((certify) => certify.step === rollback.step && certify.attempt === rollback.attempt);
const passed = run.certifies.find((certify) => certify.step === rollback.step && certify.attempt === rollback.attempt + 1);
const pin = run.pins.find((pinned) => pinned.step === rollback.step);
if (failed?.verdict !== 'fail' || passed?.verdict !== 'pass' || !pin) throw new Error('the fault run changed');

const stage = document.getElementById('stage');
const wires = document.getElementById('wires');
const svg = (tag, attributes) => {
  const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
  wires.append(element);
  return element;
};
const block = (className, lines, style) => {
  const element = document.createElement('div');
  element.className = className;
  for (const line of lines) element.append(typeof line === 'string' ? Object.assign(document.createElement('div'), { textContent: line }) : line);
  Object.assign(element.style, style);
  stage.append(element);
  return element;
};

block('note center', [`a seeded fault, in a separate ${Math.round(run.seconds / 60)}-minute run`], { left: '640px', top: '160px', fontSize: '28px', color: 'var(--ink-2)', fontWeight: '600' });

const boxTop = 296;
const height = 110;
const width = 250;
const lefts = [40, 356, 672, 988];
// Each block's outline once it is opaque: its outcome's color (failure, success), else ink.
const stages = [
  { title: `attempt ${failed.attempt}`, mark: '✗', outcome: 'var(--fail)', notes: [] },
  { title: 'rolled back', notes: [] },
  { title: pin.files[0].split('/').at(-1), mono: true, notes: ['stays where it was'] },
  { title: `attempt ${passed.attempt}`, mark: '✓', outcome: 'var(--pass)', notes: ['certified'], noteOutcome: true },
].map((stageSpec, index) => {
  const box = block('node', [], { left: `${lefts[index]}px`, top: `${boxTop}px`, width: `${width}px`, height: `${height}px` });
  const mark = stageSpec.mark ? Object.assign(document.createElement('span'), { textContent: stageSpec.mark }) : null;
  const titleLine = document.createElement('div');
  titleLine.append(stageSpec.title);
  if (mark) titleLine.append(' ', mark);
  box.append(block(`node-title${stageSpec.mono ? ' mono' : ''}`, [titleLine], { fontSize: stageSpec.mono ? '28px' : '30px' }));
  const notes = block('note center', stageSpec.notes, { left: `${lefts[index] + width / 2}px`, top: `${boxTop + height + 22}px`, fontWeight: stageSpec.noteOutcome ? '700' : '400' });
  return { ...stageSpec, box, mark, notes };
});
// The arrow into each block after the first: it lights with the block it leads to.
const arrows = lefts.slice(1).map((left) => {
  const [x1, x2, y] = [left - 66 + 10, left - 10, boxTop + height / 2];
  const line = svg('path', { d: `M ${x1} ${y} L ${x2 - 12} ${y}`, class: 'wire' });
  line.style.stroke = 'var(--ink)';
  const head = svg('polygon', { points: `${x2},${y} ${x2 - 16},${y - 9} ${x2 - 16},${y + 9}`, class: 'head' });
  head.style.fill = 'var(--ink)';
  // One group, so a faint arrow is one even tint where the line and the head overlap.
  const whole = svg('g', {});
  whole.append(line, head);
  return whole;
});

const mix = (from, to, amount) => `color-mix(in srgb, ${to} ${(clamp(amount) * 100).toFixed(2)}%, ${from})`;
/** How far a block is through its moment: 0 before `start`, 1 after; a moment at the shot's first frame is 1 from it. */
const lit = (t, start) => (start <= 0 ? 1 : progress(t, start, SCHEDULE.lighting));
window.renderAt = (t) => {
  const amounts = SCHEDULE.stages.map((start) => lit(t, start));
  stages.forEach(({ box, mark, notes, outcome, noteOutcome }, index) => {
    const opacity = String(lerp(FAINT, 1, amounts[index]));
    box.style.opacity = notes.style.opacity = opacity;
    if (index) arrows[index - 1].style.opacity = opacity;
    const outline = outcome ? mix('var(--ink)', outcome, amounts[index]) : 'var(--ink)';
    box.style.borderColor = outline;
    if (mark) mark.style.color = outline;
    if (noteOutcome) notes.style.color = mix('var(--ink-2)', outcome, amounts[index]);
  });
};
window.renderAt(0);
</script>
</html>
