<!doctype html><html lang="en"><meta charset="utf-8"><title>ac splits the job: the map, the move, the proof</title>
<!-- M2, the loop. Shot "loop" (B5) plays 0–19 s: the three blocks become current one after another as the voice names
     them, then the commit lands. Shot "loop-fail" (B6's opening) opens it with ?from=19, the loop's last picture: the
     checker says no, the way back to the move turns red and the commit goes back to faint.
     The faint stage is for chronology only: each block, its note and the arrow into it are faint with an ink outline
     until their moment, then opaque. The current block's outline is blue; once the next one is current it goes back to
     ink and stays opaque. Green is the commit (success), red the failure. The way back is faint in the loop (it is not
     taken there). The cost line is not part of the chronology: absent until the voice names it, then there. -->
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="diagrams.css">
<script src="../../out/v2/data.js"></script>
<script src="common.js"></script>
<div class="stage" id="stage"><svg class="wires" id="wires"></svg></div>
<script>
// Seconds on the page's clock, keyed to the voice-over (v2.3, B5 and B6's opening). Retime here, then the shots'
// lengths in shots-diagrams.mjs: loop plays 0–19 s, loop-fail starts the clock at 19 s (?from=19).
const SCHEDULE = {
  // "So ac splits the job." (0–1.8 s): the blocks, their notes, the commit and the way back, all faint.
  map: 1.8, // "Nemotron draws the map: which feature each file belongs to." (1.8–5.8 s)
  cost: 5.8, // "Two calls on Nebius Token Factory, twenty cents." (5.8–8.6 s): the cost line appears
  move: 8.6, // "Plain code moves the files and updates their imports, one feature per commit." (8.6–13 s)
  proof: 13.0, // "And a separate checker proves every import still reaches the same file." (13–17 s)
  commit: 17.0, // the commit lands (17–19 s); the loop shot ends at 19 s
  // loop-fail (?from=19), B6: "Just to test it, we broke one import on purpose."
  failChecker: 19.5, // the checker's outline and its ✗ turn red
  failPath: 20.0, // the way back and its label turn red and opaque
  failCommit: 20.4, // the commit goes back to faint: rolled back
  lighting: 0.5, // faint → opaque, ink → blue, and each color change
  costFade: 0.3, // the cost line's plain fade
};
// numbers.md row 51: the immich plan's two paid calls (the draft editor and the review), $0.1998 together.
const COST = { calls: 2, dollars: '$0.20' };
// Not yet its moment.
const FAINT = 0.35;
const from = Number(new URLSearchParams(location.search).get('from')) || 0;

const stage = document.getElementById('stage');
const wires = document.getElementById('wires');
const svg = (tag, attributes) => {
  const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
  wires.append(element);
  return element;
};
const block = (className, lines, style) => {
  const element = document.createElement('div');
  element.className = className;
  for (const line of lines) element.append(Object.assign(document.createElement('div'), { textContent: line }));
  Object.assign(element.style, style);
  stage.append(element);
  return element;
};
const mix = (from, to, amount) => `color-mix(in srgb, ${to} ${(clamp(amount) * 100).toFixed(2)}%, ${from})`;

// The three parts, each with its note, then the commit.
const boxTop = 230;
const boxHeight = 140;
const boxWidth = 250;
const middle = boxTop + boxHeight / 2;
const noteTop = boxTop + boxHeight + 22;
const parts = [
  { x: 40, title: 'Nemotron', subtitle: 'the map', note: ['which feature', 'each file belongs to'] },
  { x: 370, title: 'plain code', subtitle: 'the move', note: ['moves files,', 'updates import paths'] },
  { x: 700, title: 'the checker', subtitle: 'the proof', note: ['every import reaches', 'the same file'] },
].map((part) => {
  const element = block('node', [], { left: `${part.x}px`, top: `${boxTop}px`, width: `${boxWidth}px`, height: `${boxHeight}px` });
  element.append(Object.assign(document.createElement('div'), { className: 'node-title', textContent: part.title, style: 'font-size:32px' }));
  element.append(Object.assign(document.createElement('div'), { className: 'node-subtitle', textContent: part.subtitle }));
  const note = block('note center', part.note, { left: `${part.x + boxWidth / 2}px`, top: `${noteTop}px` });
  return { ...part, element, note, center: part.x + boxWidth / 2 };
});
const commit = block('node', [], { left: '1030px', top: `${middle - 45}px`, width: '220px', height: '90px' });
commit.append(Object.assign(document.createElement('div'), { className: 'node-title', textContent: 'commit' }));

const wire = (d, attributes = {}) => svg('path', { d, class: 'wire', ...attributes });

/** A line and its head in one group, so a faint arrow is one even tint where they overlap. */
const group = (...elements) => {
  const created = svg('g', {});
  created.append(...elements);
  return created;
};

// The arrow into each block after the first: faint until that block's moment, then opaque with it.
const arrow = (x1, x2) => {
  const line = wire(`M ${x1} ${middle} L ${x2 - 12} ${middle}`);
  const head = svg('polygon', { points: `${x2},${middle} ${x2 - 16},${middle - 9} ${x2 - 16},${middle + 9}`, class: 'head' });
  return { line, head, whole: group(line, head) };
};
const arrows = [arrow(300, 360), arrow(630, 690), arrow(960, 1020)];
// The checker → commit arrow's ✓: the commit's success.
const passMark = block('note center', ['✓'], { left: '990px', top: `${middle - 52}px`, fontSize: '32px', fontWeight: '700' });

// The way back: from the checker over the top to the move, with its ✗ just above the checker where it leaves.
const [checkerX, moveX] = [parts[2].center, parts[1].center];
const back = wire(`M ${checkerX} ${boxTop - 8} C ${checkerX} 120, ${moveX} 120, ${moveX} ${boxTop - 18}`, { 'stroke-dasharray': '10 10' });
const backHead = svg('polygon', { points: `${moveX},${boxTop - 4} ${moveX - 9},${boxTop - 21} ${moveX + 9},${boxTop - 21}`, class: 'head' });
const backWhole = group(back, backHead);
const backLabel = block('note center', ['roll back'], { left: `${(checkerX + moveX) / 2}px`, top: '88px', fontWeight: '600' });
const failMark = block('note center', ['✗'], { left: `${checkerX + 26}px`, top: `${boxTop - 56}px`, fontSize: '32px', fontWeight: '700' });

// What Nemotron's map cost: not part of the chronology, so absent until the voice says it.
const cost = block('note', [], { left: '40px', top: '530px', color: 'var(--muted)' });
cost.append(
  Object.assign(document.createElement('b'), { textContent: `${COST.calls} calls · ${COST.dollars}`, style: 'font-size:34px;color:var(--ink)' }),
  Object.assign(document.createElement('span'), { textContent: 'Nemotron 3 Ultra via Nebius Token Factory', style: 'margin-left:24px' }),
);

const paint = (element, opacity, color) => {
  element.style.opacity = String(opacity);
  element.style.color = color;
};
window.renderAt = (seconds) => {
  const t = seconds + from;
  // How far each part is through its moment, and how current it still is (until the next one's moment).
  const lit = [SCHEDULE.map, SCHEDULE.move, SCHEDULE.proof, SCHEDULE.commit].map((start) => progress(t, start, SCHEDULE.lighting));
  const no = progress(t, SCHEDULE.failChecker, SCHEDULE.lighting);
  const red = progress(t, SCHEDULE.failPath, SCHEDULE.lighting);
  const committed = lit[3] * (1 - progress(t, SCHEDULE.failCommit, SCHEDULE.lighting));

  parts.forEach((part, index) => {
    const current = lit[index] - lit[index + 1];
    let outline = mix('var(--ink)', 'var(--ac)', current);
    if (index === 2) outline = mix(outline, 'var(--fail)', no);
    part.element.style.borderColor = outline;
    part.element.style.opacity = part.note.style.opacity = String(lerp(FAINT, 1, lit[index]));
  });
  arrows.forEach(({ line, head, whole }, index) => {
    whole.style.opacity = String(lerp(FAINT, 1, index === 2 ? committed : lit[index + 1]));
    line.style.stroke = head.style.fill = 'var(--ink)';
  });

  // The commit: green while it stands; rolled back, faint again with an ink outline.
  commit.style.opacity = String(lerp(FAINT, 1, committed));
  commit.style.borderColor = mix('var(--ink)', 'var(--pass)', committed);
  paint(passMark, lerp(FAINT, 1, committed), mix('var(--ink)', 'var(--pass)', committed));

  // The way back: faint in the loop; red and opaque when the checker says no.
  paint(failMark, lerp(FAINT, 1, no), mix('var(--ink)', 'var(--fail)', no));
  backWhole.style.opacity = String(lerp(FAINT, 1, red));
  back.style.stroke = backHead.style.fill = mix('var(--ink)', 'var(--fail)', red);
  paint(backLabel, lerp(FAINT, 1, red), mix('var(--ink)', 'var(--fail)', red));

  cost.style.opacity = String(progress(t, SCHEDULE.cost, SCHEDULE.costFade));
};
window.renderAt(0);
</script>
</html>
