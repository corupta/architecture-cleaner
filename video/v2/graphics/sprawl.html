<!doctype html><html lang="en"><meta charset="utf-8"><title>M0 · the sprawl</title>
<!-- B0: immich's real server/src at the run's base commit, sliced by type (data.typeFolders): the folder names bold,
     the file names under them, one tree too long for the screen, scrolling slowly upward. -->
<link rel="stylesheet" href="common.css">
<script src="../../out/v2/data.js"></script>
<script src="common.js"></script>
<script src="tree.js"></script>
<style>
.where{position:absolute;left:48px;top:26px;font:25px/1.3 var(--sans);color:var(--muted)}
.viewport{position:absolute;left:0;top:0;width:1280px;height:624px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 84px,#000 500px,transparent 624px);
  mask-image:linear-gradient(to bottom,transparent 0,#000 84px,#000 500px,transparent 624px)}
.tree{position:absolute;left:400px;top:0}
.tree .tree-heading{font-size:28px;line-height:44px}
.tree .folder + .folder{margin-top:18px}
.tree .files{margin-left:9px;padding-left:19px;border-left:2px solid var(--ring)}
.tree .tree-file{line-height:34px;color:var(--ink-2)}
</style>
<div class="stage">
  <div class="viewport"><div class="tree"></div></div>
  <div class="where">immich · server/src</div>
</div>
<script>
// Seconds, keyed to the voice-over (plan v2.3, B0, 0:00–0:07): "Have you ever got lost in a verbose repo, trying to
// decide where to start refactoring?" The tree is in place from the first frame and scrolls the whole sentence.
const SCHEDULE = {
  scrollStart: 0.6, // the first folder held still for a moment
  rampUp: 1.6, // seconds to reach full speed
  speed: 240, // CSS px a second at full speed
  treeTop: 100, // where the first folder starts, CSS px
};

// The type folders first, then the others, in the tree's own (alphabetical) order.
const typeSliced = ['controllers', 'dtos', 'repositories', 'services'];
const folders = [...typeSliced, ...Object.keys(data.typeFolders).filter((folder) => !typeSliced.includes(folder))];
const escape = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const treeNode = document.querySelector('.tree');
treeNode.innerHTML = folders.map((folder) => `<div class="folder"><div class="tree-heading">${escape(folder)}/</div><div class="files">${
  data.typeFolders[folder].map((file) => `<div class="tree-file">${escape(file)}</div>`).join('')}</div></div>`).join('');
const offset = tree.clockOffset();

/** How far the tree has scrolled at `t`: still, then speeding up evenly over rampUp, then a constant speed. */
function scrolled(t) {
  const { scrollStart, rampUp, speed } = SCHEDULE;
  const moving = Math.max(0, t - scrollStart);
  if (moving < rampUp) return (speed * moving * moving) / (2 * rampUp);
  return speed * (rampUp / 2 + moving - rampUp);
}

function renderAt(seconds) {
  treeNode.style.transform = `translateY(${(SCHEDULE.treeTop - scrolled(seconds + offset)).toFixed(2)}px)`;
}
window.renderAt = renderAt;
renderAt(0);
</script>
</html>
