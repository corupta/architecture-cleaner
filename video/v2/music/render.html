<!-- The music renderer's page (v2/music/render.mjs): Strudel plays the pattern, and everything it sends to the speakers is
     also tapped into a recorder. Its functions are prefixed with __ because Strudel puts its own globals on window. -->
<script>
// Everything that reaches the speakers is also tapped into a recorder: a ScriptProcessor collecting both channels.
window.__chunks = [[], []];
const original = AudioNode.prototype.connect;
AudioNode.prototype.connect = function (destination, ...rest) {
  if (destination instanceof AudioDestinationNode && this !== window.__recorderOut) {
    const context = destination.context;
    if (!window.__tap) {
      window.__tap = context.createGain();
      const recorder = context.createScriptProcessor(4096, 2, 2);
      recorder.onaudioprocess = (event) => {
        if (!window.__recording) return;
        for (let channel = 0; channel < 2; channel += 1) window.__chunks[channel].push(new Float32Array(event.inputBuffer.getChannelData(channel)));
      };
      const mute = context.createGain(); mute.gain.value = 0;
      original.call(window.__tap, recorder); original.call(recorder, mute);
      window.__recorderOut = mute; original.call(mute, destination);
    }
    original.call(this, window.__tap);
  }
  return original.call(this, destination, ...rest);
};
</script>
